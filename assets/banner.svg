<svg width="100%" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020408"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#001829"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.1"/>
    </pattern>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="200" fill="url(#bg)"/>
  
  <!-- Subtle Cyber Grid -->
  <rect width="1200" height="200" fill="url(#grid)"/>

  <!-- Geometric Abstract Nodes -->
  <g stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.3" fill="none">
    <path d="M 150 100 L 250 50 L 350 120 L 200 180 Z" />
    <path d="M 850 80 L 950 40 L 1050 110 L 900 160 Z" />
    <path d="M 350 120 L 500 80 L 650 130" stroke-opacity="0.1" />
    <path d="M 650 130 L 850 80" stroke-opacity="0.1" />
  </g>

  <!-- Glowing Intersection Points -->
  <circle cx="150" cy="100" r="2" fill="#00E5FF" opacity="0.6"/>
  <circle cx="250" cy="50" r="1.5" fill="#00E5FF" opacity="0.4"/>
  <circle cx="350" cy="120" r="2.5" fill="#00E5FF" opacity="0.8"/>
  <circle cx="200" cy="180" r="2" fill="#00E5FF" opacity="0.5"/>
  
  <circle cx="850" cy="80" r="2.5" fill="#00E5FF" opacity="0.8"/>
  <circle cx="950" cy="40" r="1.5" fill="#00E5FF" opacity="0.4"/>
  <circle cx="1050" cy="110" r="2" fill="#00E5FF" opacity="0.6"/>
  <circle cx="900" cy="160" r="2" fill="#00E5FF" opacity="0.5"/>
  
  <circle cx="500" cy="80" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="650" cy="130" r="1" fill="#ffffff" opacity="0.3"/>

  <!-- High-end Accent Line -->
  <rect x="0" y="198" width="1200" height="2" fill="url(#cyan-glow)"/>
</svg>
